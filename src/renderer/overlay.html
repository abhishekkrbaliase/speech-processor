<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
            user-select: none;
            color: white;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .drag-handle {
            height: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            cursor: move;
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border-radius: 6px 6px 0 0;
            width: 100%;
            box-sizing: border-box;
            gap: 12px;
        }

        .patient-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.7);
            flex: 1;
            pointer-events: none;
        }

        .opacity-control {
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-app-region: no-drag;
            pointer-events: auto;
        }

        .opacity-slider {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        .opacity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .opacity-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .opacity-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.6);
        }

        .overlay-content {
            display: flex;
            flex-direction: column;
            padding: 4px;
            gap: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .combined-line {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 32px;
            width: 100%;
            box-sizing: border-box;
        }

        .question-section {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 8px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        .question-text {
            color: white;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
            flex: 1;
        }

        .answer-section {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .response-display {
            color: #4CAF50;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
            flex: 1;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .status-indicator.listening {
            background: #4CAF50;
            animation: pulse 1.5s infinite;
        }

        .status-indicator.processing {
            background: #FF9800;
            animation: pulse 1s infinite;
        }

        .status-indicator.error {
            background: #F44336;
        }

        .confidence-indicator {
            font-size: 10px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .controls-line {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 0 0 6px 6px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .control-button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
            min-width: 50px;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .control-button.primary {
            background: rgba(33, 150, 243, 0.4);
            border-color: rgba(33, 150, 243, 0.6);
        }

        .control-button.danger {
            background: rgba(244, 67, 54, 0.4);
            border-color: rgba(244, 67, 54, 0.6);
        }

        .control-button.test {
            background: rgba(76, 175, 80, 0.4);
            border-color: rgba(76, 175, 80, 0.6);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>
    <!-- Drag handle with patient info -->
    <div class="drag-handle">
        <div class="patient-header">
            <span id="patient-mrn">MRN: --</span>
            <span id="patient-name">No patient loaded</span>
            <span id="progress-text">0/0</span>
        </div>
        <div class="opacity-control">
            <span class="opacity-label">👁️</span>
            <input type="range" min="44" max="100" value="70" class="opacity-slider" id="opacity-slider">
        </div>
    </div>

    <!-- Main content -->
    <div class="overlay-content" id="overlay-container">
        <!-- Combined Question and Answer Line -->
        <div class="combined-line">
            <div class="question-section">
                <div id="question-text" class="question-text">Load questions to begin...</div>
            </div>
            <div class="answer-section">
                <div class="status-indicator" id="status-indicator"></div>
                <div id="response-display" class="response-display">Speak your answer...</div>
                <div class="confidence-indicator" id="confidence-indicator"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-line">
            <button class="control-button danger" id="reset-btn">🔄 Reset</button>
            <button class="control-button primary" id="next-btn">▶️ Next</button>
            <button class="control-button test" id="test-btn">🚀 Start</button>
        </div>
    </div>

    <script src="overlay.js"></script>
</body>

</html>
