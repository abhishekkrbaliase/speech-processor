<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP temporarily disabled for debugging -->
    <title>Speech Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            user-select: none;
            color: white;
        }

        .drag-handle {
            height: 25px;
            background: rgba(255, 255, 255, 0.1);
            cursor: move;
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .patient-header {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .overlay-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
        }

        .question-line {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 8px;
            border-left: 3px solid #4285f4;
            min-height: 28px;
        }

        .question-text {
            color: white;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
        }

        .answer-line {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 8px;
            border-left: 3px solid #34a853;
            min-height: 28px;
        }

        .status-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            margin-bottom: 3px;
            line-height: 1.2;
        }

        .response-display {
            color: white;
            font-size: 11px;
            font-weight: 500;
            min-height: 16px;
            line-height: 1.3;
        }

        .controls-line {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px;
            border-left: 3px solid #ff9800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .control-button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
            min-width: 60px;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .control-button.primary {
            background: rgba(33, 150, 243, 0.4);
            border-color: rgba(33, 150, 243, 0.6);
        }

        .control-button.danger {
            background: rgba(244, 67, 54, 0.4);
            border-color: rgba(244, 67, 54, 0.6);
        }

        .control-button.test {
            background: rgba(76, 175, 80, 0.4);
            border-color: rgba(76, 175, 80, 0.6);
        }

        .control-button.recording {
            background: rgba(244, 67, 54, 0.4);
            border-color: rgba(244, 67, 54, 0.6);
            animation: recordingPulse 1.5s infinite;
        }

        .control-button.stopped {
            background: rgba(76, 175, 80, 0.4);
            border-color: rgba(76, 175, 80, 0.6);
        }

        .listening {
            animation: pulse 1.5s infinite;
        }

        .recording-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #f44336;
            border-radius: 50%;
            margin-right: 6px;
            animation: recordingBlink 1s infinite;
        }

        .stopped-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        @keyframes recordingPulse {
            0%, 100% { 
                background: rgba(244, 67, 54, 0.4);
                transform: scale(1);
            }
            50% { 
                background: rgba(244, 67, 54, 0.6);
                transform: scale(1.02);
            }
        }

        @keyframes recordingBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Drag handle with patient info -->
    <div class="drag-handle">
        <div class="patient-header">
            <span id="patient-mrn">MRN: --</span>
            <span id="patient-name">No patient loaded</span>
            <span id="progress-text">0/0</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="overlay-content">
        <!-- Question -->
        <div class="question-line">
            <div id="question-text" class="question-text">Load questions to begin...</div>
        </div>

        <!-- Answer Recognition -->
        <div class="answer-line">
            <div id="status-text" class="status-text">Ready</div>
            <div id="response-display" class="response-display">Speak your answer...</div>
        </div>

        <!-- Controls -->
        <div class="controls-line">
            <button class="control-button danger" id="reset-btn">🔄 Reset</button>
            <button class="control-button primary" id="next-btn">▶️ Next</button>
            <button class="control-button recording" id="recording-btn">🚀 Start/Pause</button>
        </div>
    </div>

    <!-- Inline JavaScript for immediate execution -->
    <script>
        // Immediate logging to verify script execution
        console.log('🚀 OVERLAY HTML: Script starting...');
        console.log('📍 Timestamp:', new Date().toISOString());
        console.log('🔍 Document state:', document.readyState);
        console.log('🌐 Window object:', typeof window);
        
        // Test basic functionality
        try {
            console.log('✅ OVERLAY: Basic JavaScript execution working');
        } catch (error) {
            console.error('❌ OVERLAY: Basic JavaScript failed:', error);
        }

        // Global state
        let overlayState = {
            patients: [],
            questions: [],
            currentPatientIndex: 0,
            currentQuestionIndex: 0,
            currentResponse: null,
            isRecording: false,
            isPaused: false,
            liveTranscriptionActive: false,
            lastPartialResult: null,
            lastFinalResult: null,
            autoStarted: false
        };

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('✅ OVERLAY: DOMContentLoaded fired');
            
            try {
                await initializeOverlay();
                setupEventListeners();
                setupLiveTranscriptionListeners();
                updateDisplay();
                
                // Auto-start recording when overlay loads (Requirement 2.1)
                await autoStartRecording();
                
                console.log('🎉 OVERLAY: Initialization complete');
            } catch (error) {
                console.error('❌ OVERLAY: Initialization failed:', error);
            }
        });

        async function initializeOverlay() {
            console.log('🔧 OVERLAY: Initializing...');
            
            // Load data from main process
            if (window.dataManager) {
                console.log('📊 OVERLAY: Loading data...');
                overlayState.patients = await window.dataManager.getAllPatients();
                overlayState.questions = await window.dataManager.getAllQuestions();
                
                console.log('✅ OVERLAY: Data loaded:', {
                    patients: overlayState.patients.length,
                    questions: overlayState.questions.length
                });
            } else {
                console.warn('⚠️ OVERLAY: DataManager not available');
            }
        }

        async function autoStartRecording() {
            console.log('🎬 OVERLAY: Auto-starting recording (Requirement 2.1)...');
            
            try {
                if (window.electronAPI) {
                    // Initialize and start live transcription automatically
                    const initResult = await window.electronAPI.initializeLiveTranscription();
                    console.log('📊 Auto-start: Live transcription init result:', initResult);
                    
                    const streamResult = await window.electronAPI.startLiveTranscriptionStreaming();
                    console.log('📊 Auto-start: Streaming start result:', streamResult);
                    
                    const audioResult = await window.electronAPI.startAudioCapture({
                        sampleRate: 16000,
                        channels: 1,
                        bufferSize: 1600 // 100ms chunks for low latency
                    });
                    console.log('📊 Auto-start: Audio capture result:', audioResult);
                    
                    // Set up automatic audio forwarding to live transcription
                    window.electronAPI.onAudioDetected((audioBuffer) => {
                        // Forward audio to live transcription
                        window.electronAPI.sendAudioToLiveTranscription(audioBuffer)
                            .then(result => {
                                if (!result.success) {
                                    console.warn('⚠️ OVERLAY: Failed to send audio to live transcription:', result.error);
                                }
                            })
                            .catch(error => {
                                console.error('❌ OVERLAY: Error sending audio to live transcription:', error);
                            });
                    });
                    
                    // Update state and UI
                    overlayState.isRecording = true;
                    overlayState.liveTranscriptionActive = true;
                    overlayState.autoStarted = true;
                    
                    updateRecordingButtonState();
                    updateStatusDisplay();
                    
                    console.log('🎉 OVERLAY: Auto-start recording completed successfully');
                } else {
                    console.error('❌ OVERLAY: ElectronAPI not available for auto-start');
                }
            } catch (error) {
                console.error('❌ OVERLAY: Auto-start recording failed:', error);
                
                // Update UI to show error state
                const responseDisplay = document.getElementById('response-display');
                if (responseDisplay) {
                    responseDisplay.textContent = `Auto-start failed: ${error.message}`;
                    responseDisplay.style.color = '#f44336';
                }
            }
        }

        function setupLiveTranscriptionListeners() {
            console.log('🎵 OVERLAY: Setting up live transcription listeners...');
            
            if (!window.electronAPI) {
                console.error('❌ OVERLAY: ElectronAPI not available for live transcription');
                return;
            }

            // Listen for partial results (interim transcription)
            window.electronAPI.onPartialResult((result) => {
                console.log('📝 OVERLAY: Received partial result:', {
                    transcript: result.transcript,
                    confidence: result.confidence,
                    stability: result.stability,
                    timestamp: new Date().toISOString()
                });
                
                displayPartialTranscription(result);
            });

            // Listen for final results
            window.electronAPI.onFinalResult((result) => {
                console.log('✅ OVERLAY: Received final result:', {
                    transcript: result.transcript,
                    confidence: result.confidence,
                    words: result.words?.length || 0,
                    timestamp: new Date().toISOString()
                });
                
                displayFinalTranscription(result);
            });

            // Listen for errors
            window.electronAPI.onLiveTranscriptionError((error) => {
                console.error('❌ OVERLAY: Live transcription error:', {
                    code: error.code,
                    message: error.message,
                    recoverable: error.recoverable,
                    timestamp: new Date().toISOString()
                });
                
                displayTranscriptionError(error);
            });

            console.log('✅ OVERLAY: Live transcription listeners setup complete');
        }

        function setupEventListeners() {
            console.log('🔧 OVERLAY: Setting up event listeners...');
            
            // Get button elements
            const resetBtn = document.getElementById('reset-btn');
            const nextBtn = document.getElementById('next-btn');
            const recordingBtn = document.getElementById('recording-btn');

            console.log('🔍 OVERLAY: Button elements found:', {
                resetBtn: !!resetBtn,
                nextBtn: !!nextBtn,
                recordingBtn: !!recordingBtn
            });

            // Reset button
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    console.log('🔄 OVERLAY: RESET BUTTON CLICKED!');
                    console.log('📍 Timestamp:', new Date().toISOString());
                    handleReset();
                });
            }

            // Next button
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    console.log('▶️ OVERLAY: NEXT BUTTON CLICKED!');
                    console.log('📍 Timestamp:', new Date().toISOString());
                    handleNext();
                });
            }

            // Recording button - Start/Pause toggle (Requirements 2.2, 2.3)
            if (recordingBtn) {
                recordingBtn.addEventListener('click', function() {
                    console.log('🎤 OVERLAY: START/PAUSE BUTTON CLICKED!');
                    console.log('📍 Timestamp:', new Date().toISOString());
                    console.log('🔍 Current state:', {
                        isRecording: overlayState.isRecording,
                        isPaused: overlayState.isPaused
                    });
                    
                    // Toggle between start and pause
                    if (overlayState.isPaused || !overlayState.isRecording) {
                        // Start/Resume
                        handleRecordingToggle();
                    } else {
                        // Pause
                        handlePause();
                    }
                });
                console.log('✅ OVERLAY: Start/Pause button event listener attached');
            } else {
                console.error('❌ OVERLAY: Start/Pause button not found!');
            }

            console.log('✅ OVERLAY: Event listeners setup complete');
        }

        function updateDisplay() {
            console.log('🖥️ OVERLAY: Updating display...');
            
            // Update patient info
            const patientMrn = document.getElementById('patient-mrn');
            const patientName = document.getElementById('patient-name');
            const progressText = document.getElementById('progress-text');
            
            if (overlayState.patients.length > 0) {
                const patient = overlayState.patients[overlayState.currentPatientIndex];
                if (patientMrn) patientMrn.textContent = `MRN: ${patient.mrn}`;
                if (patientName) patientName.textContent = patient.name;
                if (progressText) progressText.textContent = `${overlayState.currentQuestionIndex + 1}/${overlayState.questions.length}`;
                
                console.log('👤 OVERLAY: Patient displayed:', {
                    mrn: patient.mrn,
                    name: patient.name,
                    progress: `${overlayState.currentQuestionIndex + 1}/${overlayState.questions.length}`
                });
            }
            
            // Update question
            const questionText = document.getElementById('question-text');
            if (overlayState.questions.length > 0) {
                const question = overlayState.questions[overlayState.currentQuestionIndex];
                if (questionText) questionText.textContent = question.text;
                
                console.log('❓ OVERLAY: Question displayed:', question.text);
            }
            
            // Update status and recording button
            updateStatusDisplay();
            updateRecordingButtonState();
        }

        function updateStatusDisplay() {
            const statusText = document.getElementById('status-text');
            if (statusText) {
                if (overlayState.isRecording) {
                    statusText.textContent = overlayState.liveTranscriptionActive ? 'Recording - Live transcription active' : 'Recording...';
                } else {
                    statusText.textContent = 'Ready - Click Start to begin recording';
                }
            }
        }

        function updateRecordingButtonState() {
            const recordingBtn = document.getElementById('recording-btn');
            if (!recordingBtn) return;

            // Clear existing classes and content
            recordingBtn.className = 'control-button';
            
            if (overlayState.isRecording) {
                // Recording state - show Stop button (Requirement 2.2)
                recordingBtn.classList.add('recording');
                recordingBtn.innerHTML = '<span class="recording-indicator"></span>Stop';
                recordingBtn.title = 'Click to stop recording';
            } else {
                // Stopped state - show Start button (Requirement 2.2)
                recordingBtn.classList.add('stopped');
                recordingBtn.innerHTML = '<span class="stopped-indicator"></span>Start';
                recordingBtn.title = 'Click to start recording';
            }
            
            console.log('🔄 OVERLAY: Recording button state updated:', {
                isRecording: overlayState.isRecording,
                buttonText: recordingBtn.textContent,
                buttonClass: recordingBtn.className
            });
        }

        async function handleRecordingToggle() {
            console.log('🎤 OVERLAY: Toggling recording state...');
            console.log('📊 Current state:', {
                isRecording: overlayState.isRecording,
                liveTranscriptionActive: overlayState.liveTranscriptionActive
            });

            try {
                if (overlayState.isRecording) {
                    // Stop recording
                    await stopRecording();
                } else {
                    // Start recording
                    await startRecording();
                }
            } catch (error) {
                console.error('❌ OVERLAY: Recording toggle failed:', error);
                
                const responseDisplay = document.getElementById('response-display');
                if (responseDisplay) {
                    responseDisplay.textContent = `Recording error: ${error.message}`;
                    responseDisplay.style.color = '#f44336';
                }
            }
        }

        async function startRecording() {
            console.log('▶️ OVERLAY: Starting recording...');
            
            if (window.electronAPI) {
                // Initialize and start live transcription
                const initResult = await window.electronAPI.initializeLiveTranscription();
                console.log('📊 Start recording: Live transcription init result:', initResult);
                
                const streamResult = await window.electronAPI.startLiveTranscriptionStreaming();
                console.log('📊 Start recording: Streaming start result:', streamResult);
                
                const audioResult = await window.electronAPI.startAudioCapture({
                    sampleRate: 16000,
                    channels: 1,
                    bufferSize: 1600 // 100ms chunks for low latency
                });
                console.log('📊 Start recording: Audio capture result:', audioResult);
                
                // Set up automatic audio forwarding to live transcription
                window.electronAPI.onAudioDetected((audioBuffer) => {
                    window.electronAPI.sendAudioToLiveTranscription(audioBuffer)
                        .then(result => {
                            if (!result.success) {
                                console.warn('⚠️ OVERLAY: Failed to send audio to live transcription:', result.error);
                            }
                        })
                        .catch(error => {
                            console.error('❌ OVERLAY: Error sending audio to live transcription:', error);
                        });
                });
                
                // Update state
                overlayState.isRecording = true;
                overlayState.liveTranscriptionActive = true;
                
                // Update UI
                updateRecordingButtonState();
                updateStatusDisplay();
                
                const responseDisplay = document.getElementById('response-display');
                if (responseDisplay) {
                    responseDisplay.textContent = 'Recording started - speak now...';
                    responseDisplay.style.color = '#4caf50';
                    responseDisplay.classList.add('listening');
                }
                
                console.log('✅ OVERLAY: Recording started successfully');
            } else {
                throw new Error('ElectronAPI not available');
            }
        }

        async function stopRecording() {
            console.log('⏹️ OVERLAY: Stopping recording...');
            
            if (window.electronAPI) {
                try {
                    // Stop audio capture
                    await window.electronAPI.stopAudioCapture();
                    
                    // Stop live transcription streaming if method exists
                    if (typeof window.electronAPI.stopLiveTranscriptionStreaming === 'function') {
                        await window.electronAPI.stopLiveTranscriptionStreaming();
                    } else {
                        console.log('ℹ️ OVERLAY: stopLiveTranscriptionStreaming method not available, using alternative approach');
                        // Alternative: we can just stop sending audio, which effectively stops transcription
                    }
                } catch (error) {
                    console.warn('⚠️ OVERLAY: Error during stop operations:', error);
                    // Continue with state updates even if stop operations fail
                }
                
                // Update state
                overlayState.isRecording = false;
                overlayState.liveTranscriptionActive = false;
                
                // Update UI
                updateRecordingButtonState();
                updateStatusDisplay();
                
                const responseDisplay = document.getElementById('response-display');
                if (responseDisplay) {
                    responseDisplay.textContent = 'Recording stopped - click Start to resume';
                    responseDisplay.style.color = '#ffffff';
                    responseDisplay.classList.remove('listening');
                }
                
                console.log('✅ OVERLAY: Recording stopped successfully');
            } else {
                throw new Error('ElectronAPI not available');
            }
        }



        function handleReset() {
            console.log('🔄 OVERLAY: Resetting current question...');
            overlayState.currentResponse = null;
            
            const responseDisplay = document.getElementById('response-display');
            if (responseDisplay) {
                if (overlayState.isRecording) {
                    responseDisplay.textContent = 'Recording - speak your answer...';
                } else {
                    responseDisplay.textContent = 'Click Start to begin recording...';
                }
                responseDisplay.classList.remove('listening');
                responseDisplay.style.color = '#ffffff';
                responseDisplay.style.borderLeft = '3px solid #34a853';
                responseDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            }
            
            updateStatusDisplay();
        }

        async function handleNext() {
            console.log('▶️ OVERLAY: Moving to next question...');
            
            // Save current response if available
            if (overlayState.currentResponse) {
                await saveCurrentResponse();
            }
            
            // Move to next question
            overlayState.currentQuestionIndex++;
            
            // Check if we need to move to next patient
            if (overlayState.currentQuestionIndex >= overlayState.questions.length) {
                overlayState.currentQuestionIndex = 0;
                overlayState.currentPatientIndex++;
                
                // Check if we're done with all patients
                if (overlayState.currentPatientIndex >= overlayState.patients.length) {
                    console.log('🎉 OVERLAY: All questionnaires completed!');
                    console.log('📊 OVERLAY: Current state:', {
                        currentPatientIndex: overlayState.currentPatientIndex,
                        totalPatients: overlayState.patients.length,
                        currentQuestionIndex: overlayState.currentQuestionIndex,
                        totalQuestions: overlayState.questions.length
                    });
                    
                    try {
                        console.log('📤 OVERLAY: About to call showExportDialog...');
                        await showExportDialog();
                        console.log('✅ OVERLAY: showExportDialog completed');
                    } catch (error) {
                        console.error('❌ OVERLAY: Error in showExportDialog:', error);
                        alert('All questionnaires completed! There was an error showing the export dialog.');
                    }
                    return;
                }
            }
            
            // Reset response for new question
            overlayState.currentResponse = null;
            
            // Update display
            updateDisplay();
            handleReset();
        }

        function handlePause() {
            console.log('⏸️ OVERLAY: Toggling pause state...');
            overlayState.isPaused = !overlayState.isPaused;
            
            const recordingBtn = document.getElementById('recording-btn');
            if (recordingBtn) {
                recordingBtn.textContent = overlayState.isPaused ? '▶️ Resume' : '⏸️ Pause';
            }
            
            if (overlayState.isPaused) {
                // When paused, temporarily stop recording but keep the state
                if (overlayState.isRecording) {
                    stopRecording().catch(error => {
                        console.error('❌ OVERLAY: Error stopping recording during pause:', error);
                    });
                }
                updateStatusDisplay();
            } else {
                // When resuming, restart recording if it was active
                if (overlayState.isRecording) {
                    startRecording().catch(error => {
                        console.error('❌ OVERLAY: Error starting recording during resume:', error);
                    });
                }
            }
        }

        function displayPartialTranscription(result) {
            const responseDisplay = document.getElementById('response-display');
            const statusText = document.getElementById('status-text');
            
            console.log('📝 OVERLAY: Processing partial transcription:', {
                transcript: result.transcript,
                confidence: result.confidence,
                stability: result.stability,
                timestamp: new Date().toISOString()
            });
            
            if (responseDisplay) {
                // Display partial result with visual indication
                responseDisplay.textContent = result.transcript || 'Listening...';
                responseDisplay.style.opacity = '0.8'; // Partial results are semi-transparent
                responseDisplay.style.fontStyle = 'italic'; // Italic for partial results
                responseDisplay.style.color = '#ffffff';
                responseDisplay.classList.add('listening'); // Add pulsing animation
                
                // Add confidence indicator with background
                if (result.confidence > 0.8) {
                    responseDisplay.style.borderLeft = '3px solid #4caf50'; // Green for high confidence
                    responseDisplay.style.backgroundColor = 'rgba(76, 175, 80, 0.05)';
                } else if (result.confidence > 0.5) {
                    responseDisplay.style.borderLeft = '3px solid #ff9800'; // Orange for medium confidence
                    responseDisplay.style.backgroundColor = 'rgba(255, 152, 0, 0.05)';
                } else {
                    responseDisplay.style.borderLeft = '3px solid #f44336'; // Red for low confidence
                    responseDisplay.style.backgroundColor = 'rgba(244, 67, 54, 0.05)';
                }
            }
            
            if (statusText) {
                const confidencePercent = Math.round((result.confidence || 0) * 100);
                const stabilityPercent = Math.round((result.stability || 0) * 100);
                statusText.textContent = `Live transcription (${confidencePercent}% confidence, ${stabilityPercent}% stability)`;
            }
            
            // Store the partial result
            overlayState.lastPartialResult = result;
            
            console.log('✅ OVERLAY: Displayed partial transcription successfully');
        }

        function displayFinalTranscription(result) {
            const responseDisplay = document.getElementById('response-display');
            const statusText = document.getElementById('status-text');
            
            console.log('🎯 OVERLAY: Processing final transcription:', {
                transcript: result.transcript,
                confidence: result.confidence,
                words: result.words?.length || 0,
                timestamp: new Date().toISOString()
            });
            
            // Check if this matches our test case
            if (result.transcript && result.transcript.toLowerCase().includes('21st may') && result.transcript.includes('1992')) {
                console.log('🎉 OVERLAY: TEST CASE MATCH! Expected "21st May 1992 11:00 AM", got:', result.transcript);
            }
            
            if (responseDisplay) {
                // Display final result with full opacity
                responseDisplay.textContent = result.transcript || 'No speech detected';
                responseDisplay.style.opacity = '1.0'; // Full opacity for final results
                responseDisplay.style.fontStyle = 'normal'; // Normal style for final results
                responseDisplay.style.color = '#ffffff';
                responseDisplay.classList.remove('listening'); // Remove pulsing animation
                
                // Add confidence indicator with stronger background for final results
                if (result.confidence > 0.8) {
                    responseDisplay.style.borderLeft = '3px solid #4caf50'; // Green for high confidence
                    responseDisplay.style.backgroundColor = 'rgba(76, 175, 80, 0.15)'; // Stronger green background
                } else if (result.confidence > 0.5) {
                    responseDisplay.style.borderLeft = '3px solid #ff9800'; // Orange for medium confidence
                    responseDisplay.style.backgroundColor = 'rgba(255, 152, 0, 0.15)'; // Stronger orange background
                } else {
                    responseDisplay.style.borderLeft = '3px solid #f44336'; // Red for low confidence
                    responseDisplay.style.backgroundColor = 'rgba(244, 67, 54, 0.15)'; // Stronger red background
                }
            }
            
            if (statusText) {
                const confidencePercent = Math.round((result.confidence || 0) * 100);
                const wordsCount = result.words?.length || 0;
                statusText.textContent = `Final result (${confidencePercent}% confidence, ${wordsCount} words)`;
            }
            
            // Store the result for potential use
            overlayState.currentResponse = {
                text: result.transcript,
                confidence: result.confidence,
                timestamp: result.timestamp,
                words: result.words
            };
            overlayState.lastFinalResult = result;
            
            console.log('✅ OVERLAY: Displayed final transcription successfully');
        }

        function displayTranscriptionError(error) {
            const responseDisplay = document.getElementById('response-display');
            const statusText = document.getElementById('status-text');
            
            if (responseDisplay) {
                responseDisplay.textContent = `Error: ${error.message}`;
                responseDisplay.style.color = '#f44336'; // Red for errors
                responseDisplay.style.opacity = '1.0';
                responseDisplay.style.fontStyle = 'normal';
                responseDisplay.style.borderLeft = '3px solid #f44336';
                responseDisplay.style.backgroundColor = 'rgba(244, 67, 54, 0.1)';
            }
            
            if (statusText) {
                statusText.textContent = error.recoverable ? 'Error (retrying...)' : 'Error (failed)';
            }
            
            console.error('❌ OVERLAY: Displayed transcription error:', error.message);
        }

        async function saveCurrentResponse() {
            if (!overlayState.currentResponse) {
                console.log('ℹ️ OVERLAY: No response to save');
                return;
            }

            try {
                console.log('💾 OVERLAY: Saving current response...');
                
                if (window.dataManager) {
                    // Create a proper response object
                    const response = {
                        questionId: overlayState.questions[overlayState.currentQuestionIndex]?.id,
                        patientMrn: overlayState.patients[overlayState.currentPatientIndex]?.mrn,
                        rawText: overlayState.currentResponse.text || '',
                        parsedValue: overlayState.currentResponse.text || '',
                        responseType: 'any', // Default type
                        confidence: overlayState.currentResponse.confidence || 0,
                        timestamp: new Date()
                    };
                    
                    // Process the response using AI if available
                    if (window.electronAPI && response.rawText) {
                        try {
                            const parsedResponse = await window.electronAPI.parseResponse(response.rawText);
                            if (parsedResponse.success) {
                                response.parsedValue = parsedResponse.parsedValue;
                                response.responseType = parsedResponse.responseType;
                            }
                        } catch (error) {
                            console.warn('⚠️ OVERLAY: Failed to parse response with AI:', error);
                        }
                    }
                    
                    // Save the response
                    const saveResult = await window.dataManager.saveResponse(response);
                    if (saveResult.success) {
                        console.log('✅ OVERLAY: Response saved successfully');
                    } else {
                        console.error('❌ OVERLAY: Failed to save response:', saveResult.error);
                    }
                } else {
                    console.error('❌ OVERLAY: DataManager not available');
                }
            } catch (error) {
                console.error('❌ OVERLAY: Error saving response:', error);
            }
        }

        async function showExportDialog() {
            console.log('📤 OVERLAY: Showing export dialog...');
            console.log('📤 OVERLAY: Function called successfully');
            console.log('📤 OVERLAY: Checking window.exportManager availability:', !!window.exportManager);
            console.log('📤 OVERLAY: Checking window.dataManager availability:', !!window.dataManager);
            
            try {
                console.log('📤 OVERLAY: Creating export dialog...');
                // Create export dialog overlay
                const exportDialog = createExportDialog();
                console.log('📤 OVERLAY: Export dialog created:', !!exportDialog);
                
                console.log('📤 OVERLAY: Appending to document body...');
                document.body.appendChild(exportDialog);
                console.log('📤 OVERLAY: Dialog appended to body');
                
                // Show the dialog
                console.log('📤 OVERLAY: Setting display to flex...');
                exportDialog.style.display = 'flex';
                console.log('📤 OVERLAY: Dialog should now be visible');
                
            } catch (error) {
                console.error('❌ OVERLAY: Error showing export dialog:', error);
                console.error('❌ OVERLAY: Error stack:', error.stack);
                // Fallback to simple alert
                alert('All questionnaires completed! Export functionality will be available soon.');
            }
        }

        function createExportDialog() {
            console.log('🏗️ OVERLAY: Creating export dialog element...');
            const dialog = document.createElement('div');
            dialog.id = 'export-dialog';
            dialog.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(10px);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            `;
            
            const dialogContent = document.createElement('div');
            dialogContent.style.cssText = `
                background: rgba(30, 30, 30, 0.95);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                padding: 30px;
                max-width: 500px;
                width: 90%;
                color: white;
                text-align: center;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            `;
            
            dialogContent.innerHTML = `
                <h2 style="margin: 0 0 20px 0; color: #4caf50; font-size: 24px;">
                    🎉 All Questionnaires Completed!
                </h2>
                <p style="margin: 0 0 25px 0; color: rgba(255, 255, 255, 0.8); font-size: 16px; line-height: 1.5;">
                    All questions for all patients have been completed successfully.<br>
                    Would you like to export the captured answers?
                </p>
                <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                    <button id="export-csv-btn" style="
                        background: rgba(76, 175, 80, 0.4);
                        border: 1px solid rgba(76, 175, 80, 0.6);
                        border-radius: 8px;
                        color: white;
                        padding: 12px 24px;
                        font-size: 14px;
                        font-weight: 500;
                        cursor: pointer;
                        transition: all 0.2s ease;
                        min-width: 120px;
                    ">
                        📊 Export CSV
                    </button>
                    <button id="export-later-btn" style="
                        background: rgba(255, 255, 255, 0.15);
                        border: 1px solid rgba(255, 255, 255, 0.2);
                        border-radius: 8px;
                        color: white;
                        padding: 12px 24px;
                        font-size: 14px;
                        font-weight: 500;
                        cursor: pointer;
                        transition: all 0.2s ease;
                        min-width: 120px;
                    ">
                        Later
                    </button>
                </div>
                <div id="export-status" style="
                    margin-top: 20px;
                    padding: 10px;
                    border-radius: 6px;
                    font-size: 14px;
                    display: none;
                "></div>
            `;
            
            dialog.appendChild(dialogContent);
            
            // Add event listeners
            const exportCsvBtn = dialogContent.querySelector('#export-csv-btn');
            const exportLaterBtn = dialogContent.querySelector('#export-later-btn');
            const exportStatus = dialogContent.querySelector('#export-status');
            
            exportCsvBtn.addEventListener('click', async () => {
                console.log('📊 OVERLAY: Export CSV button clicked');
                await handleExportCSV(exportStatus);
            });
            
            exportLaterBtn.addEventListener('click', () => {
                console.log('⏰ OVERLAY: Export later button clicked');
                closeExportDialog();
            });
            
            // Add hover effects
            exportCsvBtn.addEventListener('mouseenter', () => {
                exportCsvBtn.style.background = 'rgba(76, 175, 80, 0.6)';
                exportCsvBtn.style.transform = 'translateY(-2px)';
            });
            
            exportCsvBtn.addEventListener('mouseleave', () => {
                exportCsvBtn.style.background = 'rgba(76, 175, 80, 0.4)';
                exportCsvBtn.style.transform = 'translateY(0)';
            });
            
            exportLaterBtn.addEventListener('mouseenter', () => {
                exportLaterBtn.style.background = 'rgba(255, 255, 255, 0.25)';
                exportLaterBtn.style.transform = 'translateY(-2px)';
            });
            
            exportLaterBtn.addEventListener('mouseleave', () => {
                exportLaterBtn.style.background = 'rgba(255, 255, 255, 0.15)';
                exportLaterBtn.style.transform = 'translateY(0)';
            });
            
            return dialog;
        }

        async function handleExportCSV(statusElement) {
            try {
                console.log('📤 OVERLAY: Starting CSV export...');
                
                // Show loading status
                statusElement.style.display = 'block';
                statusElement.style.background = 'rgba(33, 150, 243, 0.2)';
                statusElement.style.color = '#2196f3';
                statusElement.textContent = '⏳ Preparing export...';
                
                if (!window.exportManager) {
                    console.warn('⚠️ OVERLAY: Export manager not available, showing simple dialog');
                    statusElement.style.display = 'block';
                    statusElement.style.background = 'rgba(255, 152, 0, 0.2)';
                    statusElement.style.color = '#ff9800';
                    statusElement.textContent = '⚠️ Export functionality not fully available. Please use the main app export feature.';
                    return;
                }
                
                // Configure export settings for the task requirements
                // The task specifies: CSV format with MRN number, Question Number, and Answer captured
                const exportSettings = {
                    format: 'csv',
                    includeTimestamps: true,
                    includeConfidence: true,
                    includeRawText: true,
                    includePatientDetails: true,
                    includeQuestionDetails: true,
                    sortBy: 'patient' // Sort by patient (MRN) first
                };
                
                console.log('⚙️ OVERLAY: Export settings:', exportSettings);
                
                // Update status
                statusElement.textContent = '📊 Exporting data...';
                
                // Use the export manager to show file dialog and export
                const exportResult = await window.exportManager.exportWithDialog(exportSettings);
                
                console.log('📋 OVERLAY: Export result:', exportResult);
                
                if (exportResult.success) {
                    // Show success status
                    statusElement.style.background = 'rgba(76, 175, 80, 0.2)';
                    statusElement.style.color = '#4caf50';
                    statusElement.innerHTML = `
                        ✅ Export completed successfully!<br>
                        <small>File: ${exportResult.filePath}<br>
                        Records: ${exportResult.recordCount} | Size: ${(exportResult.fileSize / 1024).toFixed(1)} KB</small>
                    `;
                    
                    // Auto-close dialog after 3 seconds
                    setTimeout(() => {
                        closeExportDialog();
                    }, 3000);
                    
                } else {
                    // Show error status
                    statusElement.style.background = 'rgba(244, 67, 54, 0.2)';
                    statusElement.style.color = '#f44336';
                    statusElement.textContent = `❌ Export failed: ${exportResult.error}`;
                }
                
            } catch (error) {
                console.error('❌ OVERLAY: Export error:', error);
                
                // Show error status
                statusElement.style.display = 'block';
                statusElement.style.background = 'rgba(244, 67, 54, 0.2)';
                statusElement.style.color = '#f44336';
                statusElement.textContent = `❌ Export error: ${error.message}`;
            }
        }

        function closeExportDialog() {
            const dialog = document.getElementById('export-dialog');
            if (dialog) {
                dialog.remove();
            }
            console.log('🚪 OVERLAY: Export dialog closed');
        }

        // Global error handlers
        window.addEventListener('error', (event) => {
            console.error('❌ OVERLAY: Global error:', event.error);
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('❌ OVERLAY: Unhandled promise rejection:', event.reason);
        });

        console.log('🎯 OVERLAY HTML: Script loaded completely');
    </script>
</body>
</html>
